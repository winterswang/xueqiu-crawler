name: tests

# 需要 secret ANALYZER_REPO_TOKEN：一个能只读访问 winterswang/xueqiu-analyzer-skill
# 的 fine-grained PAT。该仓库是 private，默认的 GITHUB_TOKEN 只能读当前仓库，
# 跨仓库 checkout 会 404。缺少 secret 时 job 会在 checkout 步骤失败。
#
# 配置（一次性）:
#   1. 建 fine-grained PAT，仅授权 xueqiu-analyzer-skill 的 Contents: Read
#   2. gh secret set ANALYZER_REPO_TOKEN --repo winterswang/xueqiu-crawler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # scripts/waf_bridge.py 引用 analyzer 的 xueqiu_analyzer.waf（风控判定唯一实现），
      # scripts/generate_report.py 也经它间接依赖。拿不到会 SystemExit。
      - name: Checkout analyzer (private)
        uses: actions/checkout@v4
        with:
          repository: winterswang/xueqiu-analyzer-skill
          path: _deps/xueqiu-analyzer-skill
          token: ${{ secrets.ANALYZER_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 里没有 pytest，测试依赖单独装
          pip install -r requirements.txt pytest
          pip install -e _deps/xueqiu-analyzer-skill

      - name: Run tests
        env:
          XUEQIU_ANALYZER_PATH: ${{ github.workspace }}/_deps/xueqiu-analyzer-skill/src
        run: python -m pytest tests/ -q
