name: checks

# analyzer 已 public，跨仓库 checkout 用默认凭据即可，无需 PAT secret。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 版本固定：ruff 升级会引入新规则，不锁的话 CI 会在没有任何代码改动时突然变红。
      # 升级 ruff 时同步跑一遍 ruff check --fix / ruff format，当作一次独立改动提交。
      - name: Install ruff
        run: pip install ruff==0.12.4

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # scripts/waf_bridge.py 引用 analyzer 的 xueqiu_analyzer.waf（风控判定唯一实现），
      # scripts/generate_report.py 也经它间接依赖。拿不到会 SystemExit。
      - name: Checkout analyzer
        uses: actions/checkout@v4
        with:
          repository: winterswang/xueqiu-analyzer-skill
          path: _deps/xueqiu-analyzer-skill

      # 插件已独立成仓（2026-10-12）。tests/plugin_source.py 按「env → _deps → 已安装插件」
      # 解析插件源码，本仓不再保留副本；解析不到会 AssertionError（故意失败，不跳过）。
      # ref 固定：只有主动「升 ref」时，对岸的改动才会影响这里的守卫 —— 升 ref 是本仓发版流程的一步。
      - name: Checkout opencli-adapters
        uses: actions/checkout@v4
        with:
          repository: winterswang/opencli-adapters
          # 2026-10-13 升 ref：6ed6c56 移除了 xiaohongshu search 覆盖（插件命令 7 → 6 条）。
          # 必须与 test_opencli_command_names.py 的条数断言同步，否则守卫会读到旧 ref 而红。
          ref: 6ed6c5676e8d95787da749998c0461e5c7b05563
          path: _deps/opencli-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 里没有 pytest，测试依赖单独装
          pip install -r requirements.txt pytest
          pip install -e _deps/xueqiu-analyzer-skill

      - name: Run tests
        env:
          XUEQIU_ANALYZER_PATH: ${{ github.workspace }}/_deps/xueqiu-analyzer-skill/src
        run: python -m pytest tests/ -q
