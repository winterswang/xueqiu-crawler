# 雪球爬虫配置

crawler:
  delay_min: 2              # 文章间最小请求间隔(秒)
  delay_max: 5              # 文章间最大请求间隔(秒)
  # 用户间延迟由 _user_delay() 控制：前4个5-10s，之后8-15s
  timeout: 60               # 页面超时(秒)
  headless: true            # 无头模式（new headless via --headless=new）
  max_articles: 50          # 每次最多爬取文章数
  max_retries: 3            # 最大重试次数
  browser_restart_interval: 5  # 每 N 用户重启/旋转 browser session（防 WAF 累积）
  retry_max_rounds: 3          # WAF 拦截后冷却重试轮数
  retry_cooldown_seconds: 180  # 重试间 WAF 冷却时间（秒）

storage:
  output_dir: data/         # 输出目录
  format: markdown          # 存储格式

# 全网热门贴（日报融合分析的热贴数据源，scripts/hot_posts.py）
# 数据源：opencli xueqiu hot（DOM 适配器，opencli-adapters#8/#9）
# 产出 data/hot_posts/<date>/hot_top10.json，由 generate_report.py 读入后与自选账号
# 文章按文章 ID 去重合并，走同一套 LLM 分析（不再单独成段）。
hot_posts:
  enabled: true
  limit: 60               # 抓取条数上限（--limit）；热门榜当天供给多少取多少
  scrolls: 5              # 滚动加载页数（--scrolls，每次约 +8-10 条，适配器上限 5）
  window_hours: 24         # 滚动时间窗（小时）：只收「抓取时刻往前 N 小时」内发布的帖。
                           # 抓取时刻固定在 06:00（hermes: xueqiu-hot-posts-prepare，
                           # 2026-10-19 从 01:00 挪过来），所以窗口就是「前一天 06:00 →
                           # 今天 06:00」——当天 06:00-08:00 发的帖子不在榜上。换来的是
                           # 不与 08:00 的爬取挤同一个滚动小时额度。跨零点发布的条目标「今晨」
  top_n: 10               # 进日报的条数（融合后最多新增这么多次分析）
  fetch_fulltext: false   # 08:00 生成日报时是否补抓缺失的全文。默认关：
                          # 全文由 prepare job（hot_posts.py --fetch-fulltext）
                          # 提前抓好写进 hot_top10.json，08:00 只读文件、零请求。
                          # 打开它只影响「prepare 没抓到全文」的那几条，会重新把
                          # 页面请求叠进 08:00 的滚动小时额度（约 64 → +N）。
  freshness_half_life_hours: 36  # 新鲜度半衰期（小时）
  repeat_decay: 0.9       # 命中昨日 top10 的连击降权系数
  prefetch_max: 50        # prepare 抓全文的条数上限（0 = 全部候选）。抓完再打分，
                          # 因为 watchlist(15) 和 depth(5) 要看全文；摘要只有 133-179 字。
  fulltext_budget_seconds: 900  # 抓全文的时间预算。15s/条 × 45 条 ≈ 11 分钟。
                                # 截断会让后半段条目只能按摘要评分，与前面的不可比。
  fulltext_interval_seconds: 15 # 相邻详情页抓取的最小间隔（秒）。站点风控对详情页是
                                # 令牌桶（≈32 篇 + 每分钟回 1）：11s 连发 5 篇/分会在
                                # 第 42 篇左右撞墙（10-19 两次实测），15s ≈ 4 篇/分可过。
                                # 0 = 不额外限速。调大时确认 budget_seconds 还够用。
  depth_chars:            # 内容深度分档，按**全文**字数（摘要长度到不了这些档位）
    deep: 3000            # >3000 → 1.0
    medium: 1500          # >1500 → 0.75
    short: 800            # >800 → 0.5，否则 0.25
  penalties:              # 权重表之外的一次性扣分（负分）
    pnl_showoff: 20       # 晒收益/账户流水（「我今年赚了300万」「回撤170万」）：
                          # 直接扣 20 分，基本进不了 Top10。只认具体金额，不碰
                          # 公司业绩分析和纯持仓记录。LLM 侧还会再压到参考。
  weights:                # 打分权重（和为 100）
    rank: 30              # 雪球热门榜位次
    freshness: 20         # 新鲜度
    engagement: 20        # 互动热度（赞+2评+3转，log 归一）
    watchlist: 15         # 正文命中自选股
    followed: 10          # 作者在关注列表（accounts.yaml）
    depth: 5              # 内容深度（长文加分）

# AI 分析配置
analysis:
  provider: "minimax"           # 默认 provider: minimax / aliyun
  models:
    minimax: "deepseek-v4-1-flash-260910"  # 字节 coding plan DeepSeek-V4.1-Flash (2026-10-07 从 flash-ga-260731 升级)
    aliyun: "glm-5"             # 阿里云/百炼 模型名
  max_content_chars: 8000       # 传给 LLM 的最大字符数（长文分析完整性）
  # MiniMax API 重试策略
  retry:
    max_retries: 3              # 最大重试次数（不含首次）
    base_delay_ms: 2000         # 初始等待（ms）
    max_delay_ms: 30000         # 最大等待（ms）
    backoff_multiplier: 2.0     # 退避倍数
    retry_on_http_codes: [429, 529, 502, 503, 504]  # 重试的错误码
    request_timeout_ms: 120000   # 单次 API 调用超时（ms）

# 反爬策略（crawler 实际使用 ua_pool 列表，此处仅作默认回退）
anti_detect:
  locale: "zh-CN"
  viewport:
    width: 1280    # 缩小视口降低 Chromium 内存占用（实测 ~14MB，并更接近真实用户分辨率分布）
    height: 720
  # Chromium 额外启动参数：禁用 headless 下无用的模块，减少进程数
  chromium_args:
    - "--disable-gpu"
    - "--disable-extensions"
    - "--disable-sync"
    - "--disable-translate"
    - "--disable-background-networking"
    - "--disable-default-apps"
    - "--disable-component-update"
    - "--mute-audio"
