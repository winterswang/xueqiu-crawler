# 雪球爬虫配置

crawler:
  delay_min: 2              # 最小请求间隔(秒)
  delay_max: 5              # 最大请求间隔(秒)
  timeout: 60               # 页面超时(秒)
  headless: true            # 无头模式（new headless via --headless=new）
  max_articles: 20          # 每次最多爬取文章数
  max_retries: 3            # 最大重试次数

storage:
  output_dir: data/         # 输出目录
  format: markdown          # 存储格式
  
schedule:
  enabled: true
  cron: "0 2 * * *"         # 每天凌晨2点
  
logging:
  level: INFO
  file: logs/crawler.log

# AI 分析配置
analysis:
  provider: "minimax"           # 默认 provider: minimax / aliyun
  models:
    minimax: "MiniMax-M2.7"     # MiniMax 模型名
    aliyun: "glm-5"             # 阿里云/百炼 模型名
  max_content_chars: 8000       # 传给 LLM 的最大字符数（长文分析完整性）
  # MiniMax API 重试策略
  retry:
    max_retries: 3              # 最大重试次数（不含首次）
    base_delay_ms: 2000         # 初始等待（ms）
    max_delay_ms: 30000         # 最大等待（ms）
    backoff_multiplier: 2.0     # 退避倍数
    retry_on_http_codes: [429, 529, 502, 503, 504]  # 重试的错误码
    request_timeout_ms: 120000   # 单次 API 调用超时（ms）

# 反爬策略
anti_detect:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  locale: "zh-CN"
  viewport:
    width: 1920
    height: 1080