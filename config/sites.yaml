sites:
  xueqiu:
    enabled: true
    backend_priority: [opencli, nodriver]
    rate_limit:
      concurrency: 1
      min_interval_seconds: 4
      max_interval_seconds: 9
      hourly_requests: 80
      daily_requests: 300
    retry:
      max_attempts: 2
      backoff_base_seconds: 60
      backoff_multiplier: 2
      retry_statuses: [network_error, http_error, parse_error]
    circuit_breaker:
      failure_threshold: 3
      window_minutes: 10
      # 首跳 15 分钟，复犯 ×2 递进，封顶 60。
      # 注意递进**不覆盖单轮 job**：编排器拿到 retry_after 后不等待、直接把剩余
      # 任务逐个跳过（orchestrator._execute_with_policy），所以同一次运行里跳闸后
      # 不会「暂停→恢复」。阶梯真正起作用的是「冷却窗口内又被调起」这种跨 job 场景，
      # 以及把「刚跳闸就重试」挡住。只有账号级失败计数；详情级 WAF 不触发熔断。
      cooldown_minutes: 15
      cooldown_multiplier: 2
      max_cooldown_minutes: 60
      hard_failure_statuses: [blocked_waf, captcha_required, auth_expired]

  xiaohongshu:
    enabled: false
    backend_priority: [opencli]
    rate_limit:
      concurrency: 1
      min_interval_seconds: 12
      max_interval_seconds: 30
      hourly_requests: 25
      daily_requests: 80
    retry:
      max_attempts: 2
      backoff_base_seconds: 120
      backoff_multiplier: 2
      retry_statuses: [network_error, http_error]
    circuit_breaker:
      failure_threshold: 2
      window_minutes: 10
      cooldown_minutes: 120
      cooldown_multiplier: 2
      max_cooldown_minutes: 240
      hard_failure_statuses: [blocked_waf, captcha_required, auth_expired]
